name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - run: node bin/cli.js tests/fixtures --ci --min-score 0
      - run: node bin/cli.js tests/fixtures --full 2>&1 | head -5

  research-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Run required browser integration tests
        run: node --test tests/research-browser.test.js
        env:
          UIQ_REQUIRE_BROWSER: '1'
      - name: Benchmark labeled UI interactions across two viewports
        run: node benchmarks/hci/run.js --strict --out hci-report.json > hci-run.log
      - name: Print signal-level detection metrics
        if: always()
        run: |
          if [ -f hci-report.json ]; then
            node -e "const r=require('./hci-report.json'); console.log(JSON.stringify(r.detection.metrics,null,2)); console.log('Mistakes:',JSON.stringify(r.detection.mistakes));"
          fi
      - name: Upload HCI benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hci-benchmark-evidence
          path: |
            hci-report.json
            hci-run.log

