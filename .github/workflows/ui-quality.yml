# .github/workflows/ui-quality.yml
# Add this to your project for CI integration

name: UI Quality Gate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'components/**'
      - 'pages/**'
      - '*.css'
      - '*.scss'

jobs:
  ui-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run UI Quality Gate
        run: npx ui-quality-gate ./src --ci --min-score 80 --format markdown > ui-quality-report.md
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('ui-quality-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
