<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product catalog</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1f2937;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,a,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #1764b6;outline-offset:2px}header{background:white;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #ddd;gap:12px}main{max-width:1040px;margin:30px auto;padding:0 22px}h1{font-size:1.7rem}p{line-height:1.5}.panel{padding:22px;border:1px solid #e4e7ef;background:white;border-radius:12px;margin:16px 0}nav{display:flex;gap:16px}nav a{color:#1c4d8a}.stack{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.action{padding:12px 16px;border-radius:8px;border:1px solid #bbb;background:#fff}.primary{background:#155db1;color:white;border-color:#155db1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}@media(max-width:600px){header{flex-wrap:wrap;padding:12px}main{margin:16px auto}nav{flex-wrap:wrap}}.sort{width:40px;height:40px;border:1px solid #999;border-radius:6px;background:#fff}.tiny{width:12px;height:12px;font-size:9px;padding:0;border:0;border-radius:0}.grid article{padding:18px;border:1px solid #ddd;border-radius:8px}</style></head><body><header><strong>Marketline</strong><nav><a href="#catalog">Catalog</a><a href="#account">Account</a></nav></header><main id="catalog"><h1>Browse inventory</h1><p>Find industrial components by price, availability and lead time.</p><section class="panel"><h2>Refine results</h2><div class="stack"><label>Search parts <input type="search" placeholder="Part number"></label><button class="action">In stock</button><button class="action">Fast shipping</button></div></section><section class="panel"><h2>Results</h2><div class="stack"><button id="sort-up" aria-label="Ascending" class="sort">↑</button><button id="sort-down" aria-label="Descending" class="sort">↓</button></div><div class="grid"><article><h3>Hydraulic coupling</h3><p>In stock · 4 days</p><button class="action primary">See details</button></article><article><h3>Pressure valve</h3><p>Limited stock · 8 days</p><button class="action primary">See details</button></article></div></section></main><script></script></body></html>
