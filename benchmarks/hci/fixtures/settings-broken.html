<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings dialog</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1f2937;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,a,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #1764b6;outline-offset:2px}header{background:white;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #ddd;gap:12px}main{max-width:1040px;margin:30px auto;padding:0 22px}h1{font-size:1.7rem}p{line-height:1.5}.panel{padding:22px;border:1px solid #e4e7ef;background:white;border-radius:12px;margin:16px 0}nav{display:flex;gap:16px}nav a{color:#1c4d8a}.stack{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.action{padding:12px 16px;border-radius:8px;border:1px solid #bbb;background:#fff}.primary{background:#155db1;color:white;border-color:#155db1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}@media(max-width:600px){header{flex-wrap:wrap;padding:12px}main{margin:16px auto}nav{flex-wrap:wrap}}#settings-dialog{position:fixed;z-index:5;top:15%;left:50%;transform:translateX(-50%);min-width:min(420px,90vw);background:#fff;box-shadow:0 12px 42px #0005;padding:25px;border:1px solid #ccc;border-radius:12px}#settings-dialog[hidden]{display:none}</style></head><body><header><strong>Workspace</strong><nav><a href="#home">Home</a><a href="#profile">Profile</a></nav></header><main id="home"><h1>Workspace preferences</h1><p>Manage notifications and session defaults.</p><div class="panel"><h2>Account options</h2><p>Preferences affect your local working environment.</p><button class="action primary" id="settings-open">Edit preferences</button></div><div class="panel"><button class="action" id="outside">Download workspace data</button></div></main>
<div id="settings-dialog" role="dialog" aria-modal="true" aria-label="Preferences" hidden>
 <h2>Preferences</h2><label>Workspace label <input id="workspace" value="Operations"></label><p><label><input type="checkbox"> Weekly summary</label></p>
 <button id="save" class="action primary">Save preferences</button><button id="settings-close" class="action">Cancel</button>
</div><script>const dialog=document.querySelector('#settings-dialog'); const opener=document.querySelector('#settings-open');const first=document.querySelector('#workspace');const close=document.querySelector('#settings-close');opener.onclick=()=>{dialog.hidden=false;first.focus()};close.onclick=()=>{dialog.hidden=true;opener.focus()};</script></body></html>
